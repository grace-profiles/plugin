publishing {
    publications {
        maven(MavenPublication) {
            artifactId project.name

            from components.java

            artifact sourcesJar
            artifact javadocJar
            artifact source:"${project.buildDir}/classes/groovy/main/META-INF/grails-plugin.xml",
                     classifier:"plugin",
                     extension:'xml'
        }
    }
}

task install(dependsOn: project.tasks.withType(PublishToMavenLocal))
